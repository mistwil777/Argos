# ============================================
# Argos - Docker Compose
# Local Development Environment
# ============================================

services:
  # ============================================
  # PostgreSQL 16 - Main Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: argos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos}
      POSTGRES_USER: ${POSTGRES_USER:-argos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argos} -d ${POSTGRES_DB:-argos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argos-network

  # ============================================
  # Argos Server - FastAPI + JSON-RPC
  # ============================================
  argos-server:
    build:
      context: .
      dockerfile: argos/Dockerfile
    container_name: argos-server
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-argos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argos}
      - LANCEDB_PATH=/data/lancedb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=INFO
      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-aws}
      - DEFAULT_DIGEST_MODEL=${DEFAULT_DIGEST_MODEL:-us.amazon.nova-pro-v1:0}
      # AWS Bedrock Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BEDROCK_MODEL=${AWS_BEDROCK_MODEL:-us.amazon.nova-pro-v1:0}
      - DEFAULT_CLASSIFICATION_MODEL=${DEFAULT_CLASSIFICATION_MODEL:-us.amazon.nova-pro-v1:0}
      - DEFAULT_DIGEST_MODEL=${DEFAULT_DIGEST_MODEL:-us.amazon.nova-pro-v1:0}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Embeddings
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      # Cache directories for SentenceTransformer
      - TRANSFORMERS_CACHE=/data/lancedb/transformers_cache
      - SENTENCE_TRANSFORMERS_HOME=/data/lancedb/sentence_transformers
      - HF_HOME=/data/lancedb/huggingface
      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./argos:/app/argos:ro
      - ./config:/app/config:ro
      - ./docs:/app/docs:ro
      - ./database:/app/database:ro
      - ./scripts:/app/scripts:ro
      - .:/app/project_root:ro
      - lancedb_data:/data/lancedb
      - ./logs:/app/logs
      - playwright_browsers:/ms-playwright
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - argos-network

  # ============================================
  # Redis - Broker Celery
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: argos-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argos-network

  # ============================================
  # Celery Worker - Tâches asynchrones
  # ============================================
  celery-worker:
    build:
      context: .
      dockerfile: argos/Dockerfile
    container_name: argos-celery-worker
    restart: unless-stopped
    command: celery -A argos.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-argos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argos}
      - REDIS_URL=redis://redis:6379/0
      - LANCEDB_PATH=/data/lancedb
      - LLM_PROVIDER=${LLM_PROVIDER:-aws}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BEDROCK_MODEL=${AWS_BEDROCK_MODEL:-us.amazon.nova-pro-v1:0}
      - SEARXNG_URL=http://searxng:8080
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./argos:/app/argos:ro
      - ./config:/app/config:ro
      - lancedb_data:/data/lancedb
      - playwright_browsers:/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - argos-network

  # ============================================
  # SearXNG - Moteur de recherche agrégateur
  # ============================================
  searxng:
    image: searxng/searxng:latest
    container_name: argos-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET_KEY=argos-searxng-secret-2026
      - SEARXNG_BASE_URL=http://searxng:8080
    volumes:
      - ./config/searxng:/etc/searxng:rw
    ports:
      - "8888:8080"
    networks:
      - argos-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

# ============================================
# Networks
# ============================================
networks:
  argos-network:
    driver: bridge
    name: argos-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    name: argos-postgres-data
  lancedb_data:
    name: argos-lancedb-data
  playwright_browsers:
    name: argos-playwright-browsers
